name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint • typecheck • test • build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check agent configuration
        run: pnpm check:agent-config

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  migrate-lint:
    name: atlas migrate lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Atlas
        uses: ariga/setup-atlas@v0
        with:
          version: latest

      - name: Lint migrations
        shell: bash
        run: |
          set -euo pipefail
          MIGRATIONS_DIR="packages/skill/src/db/migrations"
          # Count actual migration files (.sql); .gitkeep and other non-migration files are ignored.
          sql_count=$(find "$MIGRATIONS_DIR" -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')
          if [ "$sql_count" -eq 0 ]; then
            echo "No SQL migrations present — asserting atlas migrate lint exits 0 against empty set."
            # With no migrations, --latest 0 lints the last zero migrations; this is a no-op
            # that exits 0 as long as the directory is reachable. We invoke atlas to prove the
            # tool is wired correctly, then explicitly check the exit code.
            atlas migrate lint \
              --dev-url "sqlite://dev?mode=memory" \
              --dir "file://$MIGRATIONS_DIR" \
              --latest 0
            echo "atlas migrate lint exited 0 (empty migrations dir)."
          else
            atlas migrate lint \
              --dev-url "sqlite://dev?mode=memory" \
              --dir "file://$MIGRATIONS_DIR" \
              --latest 1
          fi
