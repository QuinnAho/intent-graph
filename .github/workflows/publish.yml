name: Publish

on:
  push:
    tags:
      - 'skill-v*'
      - 'extension-v*'

jobs:
  publish-skill:
    if: startsWith(github.ref, 'refs/tags/skill-v')
    name: Publish @intentgraph/skill to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @intentgraph/skill build
      - run: pnpm --filter @intentgraph/agent-skill build
      - name: Publish
        working-directory: packages/agent-skill
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-extension:
    if: startsWith(github.ref, 'refs/tags/extension-v')
    name: Publish VS Code extension to Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package and publish
        working-directory: packages/extension
        run: npx --yes @vscode/vsce publish --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
